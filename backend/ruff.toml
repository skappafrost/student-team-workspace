target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (formatter handles)
    "B008", # function call in default argument — standard FastAPI Depends() idiom
]

[lint.per-file-ignores]
"test_*.py" = ["B011", "SIM"]
# Merged migrations are frozen history: their `revision` / `down_revision`
# metadata is the only thing that matters, so import order and typing idioms
# are ignored rather than hand-edited. Rewriting an already-applied migration is
# how `b5e15` collided (see add_channel_members.py:27).
"alembic/*" = ["F401", "E402", "I001", "UP007", "UP035"]
