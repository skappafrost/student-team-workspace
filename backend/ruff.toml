target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (formatter handles)
    "B008", # function call in default argument — standard FastAPI Depends() idiom
]

[lint.per-file-ignores]
"test_*.py" = ["B011", "SIM"]
"alembic/*" = ["F401", "E402"]
